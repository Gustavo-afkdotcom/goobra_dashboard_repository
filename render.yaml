# Render.com Blueprint — deploys the Carcassonne game as a single web service.
# The Express server serves both the API/WebSocket and the built React client,
# so players just share one URL. See carcassonne/DEPLOY.md for steps.
services:
  - type: web
    name: carcassonne
    runtime: node
    plan: free
    rootDir: carcassonne
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false            # set in the Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # set in the Render dashboard
